spring.application.name=mileage-assist
server.port=${PORT:8080}

# Encrypted-at-rest H2 database (AES). In production set MA_DB_PASSWORD to
# "<file-encryption-key> <user-password>" (two words separated by a space).
spring.datasource.url=${MA_DB_URL:jdbc:h2:file:./data/mileage;CIPHER=AES}
spring.datasource.username=${MA_DB_USER:mileage}
spring.datasource.password=${MA_DB_PASSWORD:dev-file-key-change-me dev-user-password-change-me}
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Session cookie hardening
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MA_SECURE_COOKIES:false}
server.servlet.session.cookie.name=MASESSION
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=${MA_FORWARD_HEADERS:none}

# Passkeys (biometric login). rp-id must be the bare domain the app is served
# from (e.g. mileage.example.com); allowed-origins is the full https origin.
ma.webauthn.rp-id=${MA_RP_ID:localhost}
ma.webauthn.allowed-origins=${MA_ALLOWED_ORIGINS:http://localhost:8080}
