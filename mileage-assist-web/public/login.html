<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2F3437">
  <title>Mileage Assist – Sign in</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
  <img class="auth-logo" src="/img/logo.svg" alt="Mileage Assist">
  <div class="card auth-card">
    <div class="auth-tabs" role="tablist">
      <button type="button" role="tab" id="tab-signin" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false">Create account</button>
    </div>

    <form id="signin-form" novalidate>
      <div class="field">
        <label for="si-email">Email</label>
        <input id="si-email" name="email" type="email" autocomplete="username webauthn" required>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input id="si-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="si-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <div id="passkey-area" hidden>
        <div class="divider">or</div>
        <button class="btn btn-dark btn-block" type="button" id="passkey-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 4.5A9.9 9.9 0 0 0 12 2.7a9.9 9.9 0 0 0-5.8 1.8.75.75 0 1 0 .9 1.2A8.4 8.4 0 0 1 12 4.2c1.8 0 3.5.5 4.9 1.5a.75.75 0 0 0 .9-1.2ZM12 6.5a6.8 6.8 0 0 0-6.8 6.8v1.2a.75.75 0 0 0 1.5 0v-1.2a5.3 5.3 0 0 1 10.6 0c0 1.9-.2 3.7-.7 5.5a.75.75 0 0 0 1.4.4c.5-1.9.8-3.9.8-5.9A6.8 6.8 0 0 0 12 6.5Zm0 3.2a3.6 3.6 0 0 0-3.6 3.6c0 2.3-.5 4.5-1.6 6.5a.75.75 0 1 0 1.3.7 15 15 0 0 0 1.8-7.2 2.1 2.1 0 0 1 4.2 0c0 3.1-.6 6.2-1.9 9a.75.75 0 1 0 1.4.6c1.4-3 2-6.3 2-9.6A3.6 3.6 0 0 0 12 9.7Zm0 2.9a.75.75 0 0 0-.75.75c0 3.4-1 6.7-2.9 9.5a.75.75 0 1 0 1.2.8c2.1-3 3.2-6.6 3.2-10.3a.75.75 0 0 0-.75-.75Z"/></svg>
          Sign in with Face ID / fingerprint
        </button>
      </div>
    </form>

    <form id="signup-form" novalidate hidden>
      <div class="field">
        <label for="su-first">First name</label>
        <input id="su-first" name="firstName" type="text" autocomplete="given-name" maxlength="80" required>
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input id="su-email" name="email" type="email" autocomplete="email" maxlength="100" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input id="su-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <span class="hint">At least 12 characters. A short phrase works well.</span>
      </div>
      <div class="field">
        <label for="su-confirm">Confirm password</label>
        <input id="su-confirm" type="password" autocomplete="new-password" required>
      </div>
      <p class="error" id="su-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
  </div>
  <p class="auth-foot">Your trip details are encrypted before they're stored. Passwords are hashed with Argon2id and never stored in plain text.</p>
</div>
<script src="/js/common.js"></script>
<script src="/js/webauthn.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
